<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CyberCard GIF Studio</title>
<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:
    radial-gradient(circle at top left,rgba(56,189,248,.22),transparent 32%),
    radial-gradient(circle at top right,rgba(96,165,250,.18),transparent 30%),
    radial-gradient(circle at bottom left,rgba(14,165,233,.12),transparent 28%),
    linear-gradient(135deg,#020617 0%,#071426 18%,#0f172a 38%,#12304f 58%,#0b2447 76%,#071426 100%);
  background-attachment:fixed;
  color:#f8fafc;
  padding:22px;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0px,rgba(255,255,255,.018) 1px,transparent 1px,transparent 8px),
    linear-gradient(120deg,transparent 20%,rgba(255,255,255,.08) 45%,transparent 70%);
  mix-blend-mode:screen;
  opacity:.75;
}

.app{max-width:1300px;margin:auto;position:relative;z-index:1}
h1{margin:0;font-size:clamp(30px,4vw,58px);letter-spacing:-.04em}
p,small{color:#b6c8df}

.grid{display:grid;grid-template-columns:390px 1fr;gap:22px}
.panel{
  background:rgba(15,23,42,.88);
  border:1px solid rgba(125,211,252,.18);
  border-radius:26px;
  padding:20px;
  box-shadow:0 24px 70px #0009,inset 0 1px 0 rgba(255,255,255,.08);
  backdrop-filter:blur(14px);
}

label{display:block;margin:13px 0 6px;color:#d7efff;font-weight:850;font-size:13px}
input,select,textarea{
  width:100%;
  background:#020617;
  color:#fff;
  border:1px solid rgba(125,211,252,.22);
  border-radius:14px;
  padding:12px;
  outline:none;
}
textarea{min-height:105px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

button{
  width:100%;
  margin-top:12px;
  border:1px solid rgba(186,230,253,.28);
  border-radius:16px;
  padding:14px;
  font-weight:950;
  color:white;
  cursor:pointer;
  background:linear-gradient(135deg,#0f172a,#0369a1,#38bdf8);
  box-shadow:0 14px 34px rgba(14,165,233,.24),inset 0 1px 0 rgba(255,255,255,.22);
}
button:disabled{opacity:.55;cursor:not-allowed}

.canvasWrap{display:flex;flex-direction:column;align-items:center;gap:14px}
canvas{
  width:100%;
  max-width:820px;
  border-radius:30px;
  box-shadow:0 30px 90px #000c,0 0 60px rgba(56,189,248,.18);
  border:1px solid rgba(125,211,252,.22);
  background:#020617;
}

.progress{color:#7dd3fc;min-height:20px;font-size:13px}

@media(max-width:980px){
  .grid{grid-template-columns:1fr}
  body{padding:14px}
}
</style>
</head>

<body>
<div class="app">
  <h1>CyberCard GIF Studio</h1>
  <p>Cartões personalizados de cibersegurança com frente, verso, PNG e GIF animado. O fundo é azul metálico; os cartões mantêm designs diferentes.</p>

  <div class="grid">
    <section class="panel">
      <label>Design</label>
      <select id="design">
        <option value="firewall">Firewall Appliance</option>
        <option value="siem">SIEM SOC Room</option>
        <option value="xdr">XDR Command Center</option>
        <option value="zerotrust">Zero Trust Executive</option>
      </select>

      <label>Lado do preview</label>
      <select id="side">
        <option value="front">Frente</option>
        <option value="back">Verso</option>
      </select>

      <label>Nome</label>
      <input id="name" value="Mariana BS">

      <label>Função</label>
      <input id="role" value="Cybersecurity Engineer">

      <div class="row">
        <div>
          <label>Email</label>
          <input id="email" value="mariana@besafe.local">
        </div>
        <div>
          <label>Telefone</label>
          <input id="phone" value="+55 41 99999-0000">
        </div>
      </div>

      <label>Empresa</label>
      <input id="company" value="Be Safe Academy">

      <label>LinkedIn / site</label>
      <input id="link" value="linkedin.com/in/marianabs">

      <label>Resumo profissional</label>
      <textarea id="cv">Profissional de cibersegurança com experiência em SOC, SIEM, XDR, arquitetura, resposta a incidentes, gestão de vulnerabilidades e pré-vendas técnicas. Traduz tecnologia para negócio sem matar o técnico por dentro.</textarea>

      <button onclick="downloadPNG()">Baixar PNG</button>
      <button id="gifBtn">Baixar GIF Animado</button>

      <div id="progress" class="progress"></div>
      <small>O GIF troca frente e verso mais devagar.</small>
    </section>

    <section class="panel canvasWrap">
      <canvas id="cardCanvas" width="1520" height="860"></canvas>
    </section>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const canvas = $("cardCanvas");
const ctx = canvas.getContext("2d");

function rr(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

function wrapText(c,text,x,y,maxWidth,lineHeight,maxLines){
  const words = String(text).split(" ");
  let line = "";
  let lines = 0;

  for(let n=0;n<words.length;n++){
    const test = line + words[n] + " ";
    if(c.measureText(test).width > maxWidth && n > 0){
      c.fillText(line,x,y);
      line = words[n] + " ";
      y += lineHeight;
      lines++;
      if(lines >= maxLines - 1){
        c.fillText(line.trim() + "...",x,y);
        return;
      }
    }else{
      line = test;
    }
  }
  c.fillText(line,x,y);
}

function base(c,colors,frame,title){
  const g = c.createLinearGradient(0,0,1520,860);
  g.addColorStop(0,colors[0]);
  g.addColorStop(.55,colors[1]);
  g.addColorStop(1,colors[2]);

  c.clearRect(0,0,1520,860);
  c.fillStyle = g;
  rr(c,0,0,1520,860,58);
  c.fill();

  c.strokeStyle = "rgba(255,255,255,.14)";
  c.lineWidth = 3;
  rr(c,2,2,1516,856,58);
  c.stroke();

  c.strokeStyle = "rgba(255,255,255,.045)";
  c.lineWidth = 1;
  const off = frame % 72;

  for(let x=-72+off;x<1520;x+=72){
    c.beginPath();c.moveTo(x,0);c.lineTo(x,860);c.stroke();
  }
  for(let y=-72+off;y<860;y+=72){
    c.beginPath();c.moveTo(0,y);c.lineTo(1520,y);c.stroke();
  }

  c.fillStyle = "rgba(255,255,255,.08)";
  c.fillRect(0,0,1520,120);

  c.fillStyle = "#f8fafc";
  c.font = "900 34px Segoe UI, Arial";
  c.fillText(title,60,78);

  c.fillStyle = frame % 22 < 11 ? "#86efac" : "#22c55e";
  c.font = "900 23px Segoe UI, Arial";
  c.fillText("● LIVE",1320,78);
}

function drawIdentity(c,accent){
  c.fillStyle = "#ffffff";
  c.font = "950 82px Segoe UI, Arial";
  c.fillText($("name").value || "Seu Nome",60,235);

  c.fillStyle = accent;
  c.font = "900 40px Segoe UI, Arial";
  c.fillText($("role").value || "Cybersecurity Professional",60,298);

  c.fillStyle = "#dbeafe";
  c.font = "500 28px Segoe UI, Arial";

  c.fillText("✉ " + ($("email").value || "email@empresa.com"),60,390);
  c.fillText("☎ " + ($("phone").value || "+55 00 00000-0000"),60,440);
  c.fillText("🏢 " + ($("company").value || "Cyber Company"),60,490);
  c.fillText("🔗 " + ($("link").value || "linkedin.com/in/seuperfil"),60,540);
}

function drawFirewall(c,frame){
  base(c,["#020617","#7f1d1d","#f97316"],frame,"FIREWALL APPLIANCE");
  drawIdentity(c,"#fdba74");

  c.fillStyle = "rgba(17,24,39,.94)";
  rr(c,930,430,500,285,44);
  c.fill();
  c.strokeStyle = "rgba(255,255,255,.22)";
  c.stroke();

  c.fillStyle = "#fdba74";
  c.font = "950 36px Segoe UI, Arial";
  c.fillText("NGFW-443",970,495);

  c.fillStyle = "#cbd5e1";
  c.font = "22px Segoe UI, Arial";
  c.fillText("IPS • WAF • VPN • TLS Inspection",970,535);

  for(let i=0;i<24;i++){
    c.fillStyle = (frame+i*2)%18<9 ? "#22c55e" : "#38bdf8";
    rr(c,970+(i%8)*52,585+Math.floor(i/8)*38,34,20,5);
    c.fill();
  }

  c.fillStyle = "#93c5fd";
  c.font = "22px Consolas, monospace";
  const logs = ["action=blocked","policy=zero_trust","ips=active","threat=contained"];
  c.fillText(logs[Math.floor(frame/18)%logs.length],60,785);
}

function drawSIEM(c,frame){
  base(c,["#020617","#172554","#0f766e"],frame,"SIEM SOC ROOM");
  drawIdentity(c,"#facc15");

  c.fillStyle = "rgba(15,23,42,.72)";
  rr(c,900,340,500,360,38);
  c.fill();
  c.strokeStyle = "rgba(125,211,252,.20)";
  c.stroke();

  c.fillStyle = "#e5e7eb";
  c.font = "24px Segoe UI, Arial";
  c.fillText("EPS 14.2k",945,400);
  c.fillText("Incidents 72",945,445);
  c.fillText("High Severity 3",945,490);

  for(let i=0;i<5;i++){
    const h = 90 + Math.sin((frame+i*9)/8)*45;
    c.fillStyle = ["#22c55e","#06b6d4","#f97316","#e11d48","#a78bfa"][i];
    rr(c,940+i*82,650-h,48,h,12);
    c.fill();
  }

  c.fillStyle = "#93c5fd";
  c.font = "22px Consolas, monospace";
  const alerts = ["Bruteforce detected","PowerShell suspicious","Beaconing detected","OAuth phishing correlated"];
  c.fillText(alerts[Math.floor(frame/18)%alerts.length],60,785);
}

function drawXDR(c,frame){
  base(c,["#020617","#064e3b","#14532d"],frame,"XDR COMMAND CENTER");
  drawIdentity(c,"#86efac");

  c.strokeStyle = "rgba(134,239,172,.35)";
  c.lineWidth = 3;
  for(let i=0;i<7;i++){
    c.beginPath();
    c.arc(1150,470,70+i*34+Math.sin(frame/8)*6,0,Math.PI*2);
    c.stroke();
  }

  c.fillStyle = "#86efac";
  c.beginPath();
  c.arc(1150,470,18,0,Math.PI*2);
  c.fill();

  c.fillStyle = "#d1fae5";
  c.font = "26px Segoe UI, Arial";
  c.fillText("Protected endpoints: 4,231",910,650);
  c.fillText("Blocked threats: 28",910,695);
  c.fillText("Response: automated",910,740);

  c.fillStyle = "#bbf7d0";
  c.font = "22px Consolas, monospace";
  c.fillText("xdr.status=healthy",60,785);
}

function drawZeroTrust(c,frame){
  base(c,["#09090b","#581c87","#c084fc"],frame,"ZERO TRUST EXECUTIVE BADGE");
  drawIdentity(c,"#f5d0fe");

  c.fillStyle = "rgba(255,255,255,.10)";
  rr(c,920,360,470,330,46);
  c.fill();

  c.fillStyle = "#f5d0fe";
  c.font = "900 34px Segoe UI, Arial";
  c.fillText("IDENTITY SCORE",980,440);

  c.fillStyle = "#ffffff";
  c.font = "950 92px Segoe UI, Arial";
  c.fillText("98%",980,545);

  c.fillStyle = "#e9d5ff";
  c.font = "26px Segoe UI, Arial";
  c.fillText("MFA enabled",980,610);
  c.fillText("Device compliant",980,650);

  c.fillStyle = "#ddd6fe";
  c.font = "22px Consolas, monospace";
  c.fillText("identity.access=granted",60,785);
}

function drawBack(c,frame){
  base(c,["#020617","#111827","#1e293b"],frame,"BACKSIDE PROFILE");

  c.fillStyle = "#67e8f9";
  c.font = "950 54px Segoe UI, Arial";
  c.fillText("Resumo profissional",60,180);

  c.fillStyle = "#e5e7eb";
  c.font = "500 34px Segoe UI, Arial";
  wrapText(c,$("cv").value,60,270,1120,52,7);

  const metrics = [
    ["24x7","mentalidade SOC"],
    ["443","porta favorita"],
    ["0","paciência p/ falso positivo"]
  ];

  metrics.forEach((m,idx)=>{
    const x = 60 + idx * 350;
    c.fillStyle = "rgba(15,23,42,.90)";
    rr(c,x,620,320,130,24);
    c.fill();
    c.strokeStyle = "rgba(255,255,255,.15)";
    c.stroke();

    c.fillStyle = "#facc15";
    c.font = "900 42px Segoe UI, Arial";
    c.fillText(m[0],x+24,690);

    c.fillStyle = "#94a3b8";
    c.font = "22px Segoe UI, Arial";
    c.fillText(m[1],x+24,728);
  });

  c.fillStyle = "#ffffff";
  rr(c,1260,600,150,150,18);
  c.fill();

  c.fillStyle = "#020617";
  for(let i=0;i<7;i++){
    for(let j=0;j<7;j++){
      if((i*j+i+j+Math.floor(frame/6))%3!==0){
        c.fillRect(1275+i*18,615+j*18,12,12);
      }
    }
  }
}

function drawFront(c,frame){
  const d = $("design").value;
  if(d === "firewall") drawFirewall(c,frame);
  else if(d === "siem") drawSIEM(c,frame);
  else if(d === "xdr") drawXDR(c,frame);
  else drawZeroTrust(c,frame);
}

function drawFrameTo(c,side,frame){
  if(side === "back") drawBack(c,frame);
  else drawFront(c,frame);
}

function drawPreview(){
  drawFrameTo(ctx,$("side").value,Math.floor(Date.now()/60));
}

function animate(){
  drawPreview();
  requestAnimationFrame(animate);
}

function downloadPNG(){
  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = $("side").value === "front" ? "cybercard-frente.png" : "cybercard-verso.png";
  a.click();
}

document.querySelectorAll("input,textarea,select").forEach(el=>{
  el.addEventListener("input",drawPreview);
});

animate();
</script>

<script type="module">
import { GIFEncoder, quantize, applyPalette } from "https://cdn.jsdelivr.net/npm/gifenc@1.0.3/dist/gifenc.esm.js";

const btn = document.getElementById("gifBtn");
const progress = document.getElementById("progress");

btn.addEventListener("click", async () => {
  btn.disabled = true;
  progress.textContent = "Gerando GIF...";

  const w = 520;
  const h = 294;
  const totalFrames = 20;

  const full = document.createElement("canvas");
  full.width = 1520;
  full.height = 860;
  const fctx = full.getContext("2d", { willReadFrequently:true });

  const small = document.createElement("canvas");
  small.width = w;
  small.height = h;
  const sctx = small.getContext("2d", { willReadFrequently:true });

  const gif = GIFEncoder();

  for(let i=0;i<totalFrames;i++){
    const side = i < totalFrames / 2 ? "front" : "back";
    fctx.clearRect(0,0,1520,860);

    window.drawFrameTo(fctx,side,i*5);

    sctx.clearRect(0,0,w,h);
    sctx.drawImage(full,0,0,w,h);

    const image = sctx.getImageData(0,0,w,h);
    const palette = quantize(image.data,128);
    const index = applyPalette(image.data,palette);

    gif.writeFrame(index,w,h,{
      palette,
      delay:900
    });

    progress.textContent = "Frames: " + Math.round(((i+1)/totalFrames)*100) + "%";
    await new Promise(r=>setTimeout(r,10));
  }

  progress.textContent = "Finalizando GIF...";
  gif.finish();

  const blob = new Blob([gif.bytesView()],{type:"image/gif"});
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "cybercard-animado.gif";
  document.body.appendChild(a);
  a.click();
  a.remove();

  URL.revokeObjectURL(url);
  progress.textContent = "GIF gerado com sucesso, bebê.";
  btn.disabled = false;
});
</script>

</body>
</html>
