<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CyberCard GIF Studio</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;color:#f8fafc;padding:22px;overflow-x:hidden;
  background:
    radial-gradient(circle at top left,rgba(56,189,248,.22),transparent 32%),
    radial-gradient(circle at top right,rgba(96,165,250,.18),transparent 30%),
    radial-gradient(circle at bottom left,rgba(14,165,233,.12),transparent 28%),
    linear-gradient(135deg,#020617 0%,#071426 18%,#0f172a 38%,#12304f 58%,#0b2447 76%,#071426 100%);
  background-attachment:fixed;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.75;mix-blend-mode:screen;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,transparent 1px 8px),
    linear-gradient(120deg,transparent 20%,rgba(255,255,255,.08) 45%,transparent 70%);
}
.app{max-width:1320px;margin:auto;position:relative;z-index:1}
h1{margin:0;font-size:clamp(30px,4vw,58px);letter-spacing:-.04em}
p,small{color:#b6c8df}
.grid{display:grid;grid-template-columns:400px 1fr;gap:22px}
.panel{
  background:rgba(15,23,42,.88);border:1px solid rgba(125,211,252,.18);border-radius:26px;padding:20px;
  box-shadow:0 24px 70px #0009,inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(14px);
}
label{display:block;margin:13px 0 6px;color:#d7efff;font-weight:850;font-size:13px}
input,select,textarea{
  width:100%;background:#020617;color:#fff;border:1px solid rgba(125,211,252,.22);
  border-radius:14px;padding:12px;outline:none;
}
textarea{min-height:105px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{
  width:100%;margin-top:12px;border:1px solid rgba(186,230,253,.28);border-radius:16px;padding:14px;
  font-weight:950;color:white;cursor:pointer;background:linear-gradient(135deg,#0f172a,#0369a1,#38bdf8);
  box-shadow:0 14px 34px rgba(14,165,233,.24),inset 0 1px 0 rgba(255,255,255,.22);
}
button:disabled{opacity:.55;cursor:not-allowed}
.canvasWrap{display:flex;flex-direction:column;align-items:center;gap:14px}
canvas{
  width:100%;max-width:820px;border-radius:30px;box-shadow:0 30px 90px #000c,0 0 60px rgba(56,189,248,.18);
  border:1px solid rgba(125,211,252,.22);background:#020617;
}
.progress{color:#7dd3fc;min-height:20px;font-size:13px}
@media(max-width:980px){.grid{grid-template-columns:1fr}body{padding:14px}}
</style>
</head>
<body>
<div class="app">
<h1>CyberCard GIF Studio</h1>
<p>Cartões personalizados de cibersegurança com 10 modelos de frente, verso configurável, PNG e GIF animado.</p>

<div class="grid">
<section class="panel">
<label>Modelo da frente</label>
<select id="design">
  <option value="cyberpunk">Cyberpunk 4D Hacker</option>
  <option value="redteam">Red Team Offensive</option>
  <option value="blueteam">Blue Team Defense</option>
  <option value="network">Redes / Topologia Prateada</option>
  <option value="firewall">Firewall Appliance</option>
  <option value="siem">SIEM SOC Room</option>
  <option value="xdr">XDR Command Center</option>
  <option value="iam">IAM / Zero Trust</option>
  <option value="appsec">AppSec / DevSecOps</option>
  <option value="dfir">DFIR / Incident Response</option>
</select>

<label>Design do verso</label>
<select id="backDesign">
  <option value="cv">Resumo profissional</option>
  <option value="mission">Manifesto / missão</option>
  <option value="skills">Skills técnicas</option>
  <option value="quote">Frase de impacto</option>
  <option value="custom">Texto livre total</option>
</select>

<label>Lado do preview</label>
<select id="side">
  <option value="front">Frente</option>
  <option value="back">Verso</option>
</select>

<label>Nome</label>
<input id="name" value="Mariana BS">

<label>Função</label>
<input id="role" value="Cybersecurity Engineer">

<div class="row">
  <div><label>Email</label><input id="email" value="mariana@besafe.local"></div>
  <div><label>Telefone</label><input id="phone" value="+55 41 99999-0000"></div>
</div>

<label>Empresa</label>
<input id="company" value="Be Safe Academy">

<label>LinkedIn / site</label>
<input id="link" value="linkedin.com/in/marianabs">

<label>Título do verso</label>
<input id="backTitle" value="Resumo profissional">

<label>Texto do verso</label>
<textarea id="backText">Profissional de cibersegurança com experiência em SOC, SIEM, XDR, arquitetura, resposta a incidentes, gestão de vulnerabilidades e pré-vendas técnicas. Traduz tecnologia para negócio sem matar o técnico por dentro.</textarea>

<label>Skills / palavras-chave</label>
<input id="skills" value="SIEM, XDR, SOC, Firewall, Zero Trust, GRC, Cloud Security">

<button onclick="downloadPNG()">Baixar PNG</button>
<button id="gifBtn">Baixar GIF Animado HD</button>
<div id="progress" class="progress"></div>
<small>Cartões animados premium para profissionais de cibersegurança.</small>
</section>

<section class="panel canvasWrap">
<canvas id="cardCanvas" width="1520" height="860"></canvas>
</section>
</div>
</div>

<script>
const $=id=>document.getElementById(id), canvas=$("cardCanvas"), ctx=canvas.getContext("2d");

const MODELS={
cyberpunk:{title:"CYBERPUNK 4D",colors:["#050014","#3b0764","#06b6d4"],accent:"#22d3ee",type:"orbs"},
redteam:{title:"RED TEAM OPS",colors:["#120408","#7f1d1d","#ef4444"],accent:"#f87171",type:"target"},
blueteam:{title:"BLUE TEAM DEFENSE",colors:["#020617","#1d4ed8","#38bdf8"],accent:"#93c5fd",type:"shield"},
network:{title:"NETWORK TOPOLOGY",colors:["#111827","#475569","#cbd5e1"],accent:"#e5e7eb",type:"topology"},
firewall:{title:"FIREWALL APPLIANCE",colors:["#020617","#7f1d1d","#f97316"],accent:"#fdba74",type:"appliance"},
siem:{title:"SIEM SOC ROOM",colors:["#020617","#172554","#0f766e"],accent:"#facc15",type:"bars"},
xdr:{title:"XDR COMMAND CENTER",colors:["#020617","#064e3b","#14532d"],accent:"#86efac",type:"radar"},
iam:{title:"IAM / ZERO TRUST",colors:["#09090b","#581c87","#c084fc"],accent:"#f5d0fe",type:"identity"},
appsec:{title:"APPSEC DEVSECOPS",colors:["#020617","#312e81","#22c55e"],accent:"#a7f3d0",type:"pipeline"},
dfir:{title:"DFIR RESPONSE",colors:["#0c0a09","#431407","#0f172a"],accent:"#fed7aa",type:"forensic"}
};

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function text(v,f){return $(v).value||f}
function wrap(c,t,x,y,w,lh,max){
  const words=String(t).split(" ");let line="",lines=0;
  for(let n=0;n<words.length;n++){
    const test=line+words[n]+" ";
    if(c.measureText(test).width>w&&n>0){
      c.fillText(line,x,y);line=words[n]+" ";y+=lh;lines++;
      if(lines>=max-1){c.fillText(line.trim()+"...",x,y);return}
    }else line=test;
  }
  c.fillText(line,x,y);
}
function base(c,m,frame){
  const g=c.createLinearGradient(0,0,1520,860);
  g.addColorStop(0,m.colors[0]);g.addColorStop(.55,m.colors[1]);g.addColorStop(1,m.colors[2]);
  c.clearRect(0,0,1520,860);c.fillStyle=g;rr(c,0,0,1520,860,58);c.fill();
  c.strokeStyle="rgba(255,255,255,.14)";c.lineWidth=3;rr(c,2,2,1516,856,58);c.stroke();
  c.strokeStyle="rgba(255,255,255,.045)";c.lineWidth=1;const off=frame%72;
  for(let x=-72+off;x<1520;x+=72){c.beginPath();c.moveTo(x,0);c.lineTo(x,860);c.stroke()}
  for(let y=-72+off;y<860;y+=72){c.beginPath();c.moveTo(0,y);c.lineTo(1520,y);c.stroke()}
  c.fillStyle="rgba(255,255,255,.08)";c.fillRect(0,0,1520,120);
  c.fillStyle="#f8fafc";c.font="900 34px Segoe UI, Arial";c.fillText(m.title,60,78);
  c.fillStyle=frame%22<11?"#86efac":"#22c55e";c.font="900 23px Segoe UI, Arial";c.fillText("● LIVE",1320,78);
}
function identity(c,m){
  c.fillStyle="#fff";c.font="950 82px Segoe UI, Arial";c.fillText(text("name","Seu Nome"),60,235);
  c.fillStyle=m.accent;c.font="900 40px Segoe UI, Arial";c.fillText(text("role","Cybersecurity Professional"),60,298);
  c.fillStyle="#dbeafe";c.font="500 28px Segoe UI, Arial";
  c.fillText("✉ "+text("email","email@empresa.com"),60,390);
  c.fillText("☎ "+text("phone","+55 00 00000-0000"),60,440);
  c.fillText("🏢 "+text("company","Cyber Company"),60,490);
  c.fillText("🔗 "+text("link","linkedin.com/in/seuperfil"),60,540);
}
function cardBox(c,x,y,w,h){c.fillStyle="rgba(15,23,42,.72)";rr(c,x,y,w,h,38);c.fill();c.strokeStyle="rgba(255,255,255,.20)";c.stroke()}

function drawVisual(c,m,frame){
  const t=m.type;
  if(t==="orbs"){
    for(let i=0;i<11;i++){c.fillStyle=i%2?"rgba(34,211,238,.32)":"rgba(217,70,239,.28)";c.beginPath();c.arc(1050+Math.sin((frame+i)*.12)*230,460+Math.cos((frame+i)*.1)*170,18+i*2,0,Math.PI*2);c.fill()}
    c.strokeStyle="rgba(255,255,255,.28)";c.lineWidth=2;for(let i=0;i<6;i++){c.beginPath();c.arc(1130,460,80+i*42+Math.sin(frame/6)*8,0,Math.PI*2);c.stroke()}
  }
  if(t==="target"){
    cardBox(c,950,330,440,360);c.strokeStyle="#ef4444";c.lineWidth=4;
    for(let i=0;i<5;i++){c.beginPath();c.arc(1170,510,45+i*42+Math.sin(frame/8)*5,0,Math.PI*2);c.stroke()}
    c.beginPath();c.moveTo(970,510);c.lineTo(1370,510);c.moveTo(1170,350);c.lineTo(1170,670);c.stroke();
    c.fillStyle="#fecaca";c.font="22px Consolas";c.fillText("opsec.clean=true",990,650);
  }
  if(t==="shield"){
    cardBox(c,965,335,420,360);c.fillStyle="rgba(147,197,253,.18)";c.beginPath();c.moveTo(1175,390);c.lineTo(1300,455);c.lineTo(1260,620);c.lineTo(1175,670);c.lineTo(1090,620);c.lineTo(1050,455);c.closePath();c.fill();c.strokeStyle="#93c5fd";c.lineWidth=5;c.stroke();
    c.fillStyle="#dbeafe";c.font="26px Segoe UI";c.fillText("Containment Ready",1040,720);
  }
  if(t==="topology"){
    const nodes=[[1020,360],[1230,350],[1120,500],[1340,520],[990,640],[1210,665]];
    c.strokeStyle="rgba(226,232,240,.75)";c.lineWidth=4;
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++)if((i+j)%2===0){c.beginPath();c.moveTo(...nodes[i]);c.lineTo(...nodes[j]);c.stroke()}
    nodes.forEach((n,i)=>{c.fillStyle=i%2?"#e5e7eb":"#94a3b8";c.beginPath();c.arc(n[0],n[1],24+Math.sin(frame/8+i)*3,0,Math.PI*2);c.fill();c.strokeStyle="#fff";c.stroke()});
    c.fillStyle="#e2e8f0";c.font="22px Consolas";c.fillText("core-ha uplink=redundant",930,735);
  }
  if(t==="appliance"){
    cardBox(c,930,430,500,285);c.fillStyle=m.accent;c.font="950 36px Segoe UI";c.fillText("NGFW-443",970,495);c.fillStyle="#cbd5e1";c.font="22px Segoe UI";c.fillText("IPS • WAF • VPN • TLS",970,535);
    for(let i=0;i<24;i++){c.fillStyle=(frame+i*2)%18<9?"#22c55e":"#38bdf8";rr(c,970+(i%8)*52,585+Math.floor(i/8)*38,34,20,5);c.fill()}
  }
  if(t==="bars"){
    cardBox(c,900,340,500,360);c.fillStyle="#e5e7eb";c.font="24px Segoe UI";["EPS 14.2k","Incidents 72","High Severity 3"].forEach((v,i)=>c.fillText(v,945,400+i*45));
    for(let i=0;i<5;i++){const h=90+Math.sin((frame+i*9)/8)*45;c.fillStyle=["#22c55e","#06b6d4","#f97316","#e11d48","#a78bfa"][i];rr(c,940+i*82,650-h,48,h,12);c.fill()}
  }
  if(t==="radar"){
    c.strokeStyle="rgba(134,239,172,.35)";c.lineWidth=3;for(let i=0;i<7;i++){c.beginPath();c.arc(1150,470,70+i*34+Math.sin(frame/8)*6,0,Math.PI*2);c.stroke()}
    c.fillStyle="#86efac";c.beginPath();c.arc(1150,470,18,0,Math.PI*2);c.fill();c.fillStyle="#d1fae5";c.font="26px Segoe UI";["Protected endpoints: 4,231","Blocked threats: 28","Response: automated"].forEach((v,i)=>c.fillText(v,910,650+i*45));
  }
  if(t==="identity"){
    cardBox(c,920,360,470,330);c.fillStyle=m.accent;c.font="900 34px Segoe UI";c.fillText("IDENTITY SCORE",980,440);c.fillStyle="#fff";c.font="950 92px Segoe UI";c.fillText("98%",980,545);c.fillStyle="#e9d5ff";c.font="26px Segoe UI";c.fillText("MFA enabled",980,610);c.fillText("Device compliant",980,650);
  }
  if(t==="pipeline"){
    const steps=["CODE","SAST","SCA","BUILD","DEPLOY"];let x=910;
    steps.forEach((s,i)=>{c.fillStyle=i%2?"rgba(34,197,94,.22)":"rgba(59,130,246,.22)";rr(c,x,430,105,72,18);c.fill();c.strokeStyle="rgba(255,255,255,.2)";c.stroke();c.fillStyle="#e0f2fe";c.font="900 20px Segoe UI";c.fillText(s,x+20,475);if(i<steps.length-1){c.strokeStyle="#93c5fd";c.beginPath();c.moveTo(x+110,466);c.lineTo(x+145,466);c.stroke()}x+=145});
    c.fillStyle="#bbf7d0";c.font="24px Consolas";c.fillText("build.security=passed",930,650);
  }
  if(t==="forensic"){
    cardBox(c,920,350,480,340);c.strokeStyle="#fed7aa";c.lineWidth=3;
    for(let i=0;i<5;i++){c.beginPath();c.moveTo(980,430+i*42);c.lineTo(1320,430+i*42);c.stroke()}
    c.fillStyle="#fed7aa";c.font="900 34px Segoe UI";c.fillText("TIMELINE",980,415);c.fillStyle="#fdba74";c.font="22px Consolas";c.fillText("ioc.hash matched",980,660);
  }
  c.fillStyle=m.accent;c.font="22px Consolas";c.fillText("model="+m.title.toLowerCase().replaceAll(" ","_"),60,785);
}
function drawFront(c,frame){const m=MODELS[$("design").value];base(c,m,frame);identity(c,m);drawVisual(c,m,frame)}

function drawBackBase(c,frame,title,colors=["#020617","#111827","#1e293b"]){base(c,{title,colors,accent:"#67e8f9"},frame)}
function drawBack(c,frame){
  const mode=$("backDesign").value, title=text("backTitle","Verso personalizado");
  if(mode==="skills"){
    drawBackBase(c,frame,title,["#020617","#082f49","#0f172a"]);
    const skills=text("skills","SIEM, XDR").split(",").map(s=>s.trim()).filter(Boolean);let x=60,y=280;
    skills.forEach(s=>{const w=Math.max(180,s.length*18);if(x+w>1280){x=60;y+=90}c.fillStyle="rgba(14,165,233,.18)";rr(c,x,y,w,56,28);c.fill();c.strokeStyle="rgba(125,211,252,.35)";c.stroke();c.fillStyle="#e0f2fe";c.font="900 24px Segoe UI";c.fillText(s,x+24,y+37);x+=w+22});
    return;
  }
  if(mode==="quote"){
    drawBackBase(c,frame,title,["#020617","#312e81","#0f172a"]);
    c.fillStyle="rgba(255,255,255,.10)";rr(c,90,260,1240,330,44);c.fill();c.fillStyle="#fff";c.font="700 48px Segoe UI";wrap(c,"“"+text("backText","Sem evidência, sem incidente.")+"”",140,370,1120,62,4);return;
  }
  if(mode==="mission"){
    drawBackBase(c,frame,title,["#020617","#164e63","#111827"]);
    c.fillStyle="#e5e7eb";c.font="500 34px Segoe UI";wrap(c,text("backText",""),60,270,1060,52,7);
    c.fillStyle="rgba(14,165,233,.16)";rr(c,1160,240,230,360,38);c.fill();c.strokeStyle="rgba(125,211,252,.35)";c.stroke();c.fillStyle="#e0f2fe";c.font="900 28px Segoe UI";["MISSION","SECURE","VALIDATE","RESPOND"].forEach((v,i)=>c.fillText(v,1200,330+i*60));return;
  }
  drawBackBase(c,frame,mode==="custom"?title:title,mode==="custom"?["#020617","#1e293b","#334155"]:["#020617","#111827","#1e293b"]);
  c.fillStyle="#67e8f9";c.font="950 54px Segoe UI";c.fillText(title,60,180);
  c.fillStyle="#e5e7eb";c.font="500 34px Segoe UI";wrap(c,text("backText",""),60,270,1220,52,8);
  if(mode==="cv"){
    [["24x7","mentalidade SOC"],["443","porta favorita"],["0","paciência p/ falso positivo"]].forEach((m,idx)=>{const x=60+idx*350;c.fillStyle="rgba(15,23,42,.90)";rr(c,x,620,320,130,24);c.fill();c.strokeStyle="rgba(255,255,255,.15)";c.stroke();c.fillStyle="#facc15";c.font="900 42px Segoe UI";c.fillText(m[0],x+24,690);c.fillStyle="#94a3b8";c.font="22px Segoe UI";c.fillText(m[1],x+24,728)});
  }
}
function drawFrameTo(c,side,frame){side==="back"?drawBack(c,frame):drawFront(c,frame)}
window.drawFrameTo=drawFrameTo;

function drawPreview(){drawFrameTo(ctx,$("side").value,Math.floor(Date.now()/60))}
function animate(){drawPreview();requestAnimationFrame(animate)}
function downloadPNG(){const a=document.createElement("a");a.href=canvas.toDataURL("image/png");a.download=$("side").value==="front"?"cybercard-frente.png":"cybercard-verso.png";a.click()}
document.querySelectorAll("input,textarea,select").forEach(el=>el.addEventListener("input",drawPreview));
animate();
</script>

<script type="module">
import { GIFEncoder, quantize, applyPalette } from "https://cdn.jsdelivr.net/npm/gifenc@1.0.3/dist/gifenc.esm.js";
const btn=document.getElementById("gifBtn"), progress=document.getElementById("progress");
btn.addEventListener("click",async()=>{
  btn.disabled=true;progress.textContent="Gerando GIF HD...";
  const w=760,h=430,totalFrames=16;
  const full=document.createElement("canvas");full.width=1520;full.height=860;
  const fctx=full.getContext("2d",{willReadFrequently:true});
  const small=document.createElement("canvas");small.width=w;small.height=h;
  const sctx=small.getContext("2d",{willReadFrequently:true});
  const gif=GIFEncoder();
  for(let i=0;i<totalFrames;i++){
    const side=i<totalFrames/2?"front":"back";
    fctx.clearRect(0,0,1520,860);window.drawFrameTo(fctx,side,i*5);
    sctx.clearRect(0,0,w,h);sctx.drawImage(full,0,0,w,h);
    const image=sctx.getImageData(0,0,w,h), palette=quantize(image.data,256), index=applyPalette(image.data,palette);
    gif.writeFrame(index,w,h,{palette,delay:1000});
    progress.textContent="Frames: "+Math.round(((i+1)/totalFrames)*100)+"%";
    await new Promise(r=>setTimeout(r,10));
  }
  progress.textContent="Finalizando GIF HD...";gif.finish();
  const blob=new Blob([gif.bytesView()],{type:"image/gif"}),url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="cybercard-hd.gif";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  progress.textContent="GIF HD gerado com sucesso, bebê.";btn.disabled=false;
});
</script>
</body>
</html>
